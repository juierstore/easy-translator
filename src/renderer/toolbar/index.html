<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
  <title>工具条</title>
  <link rel="stylesheet" href="toolbar.css" />
</head>
<body>
  <div class="bar" id="bar">
    <div class="group">
      <button class="chip" id="srcBtn" title="当前语言">
        <span class="dot"></span>
        <span id="srcLabel">自动</span>
        <svg viewBox="0 0 10 6" class="caret"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <svg viewBox="0 0 20 10" class="arrow"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <button class="chip strong" id="tgtBtn" title="目标语言">
        <span id="tgtLabel">简体中文</span>
        <svg viewBox="0 0 10 6" class="caret"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="group actions">
      <button class="act" id="copySrcBtn" title="复制原文">
        <svg viewBox="0 0 16 16"><rect x="5.2" y="5.2" width="8" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.8 3.4V2.8A1.3 1.3 0 009.5 1.5H3.3A1.3 1.3 0 002 2.8v6.2a1.3 1.3 0 001.3 1.3h.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>复制原文</span>
      </button>
      <button class="act" id="copyDstBtn" title="复制译文">
        <svg viewBox="0 0 16 16"><rect x="5.2" y="5.2" width="8" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.8 3.4V2.8A1.3 1.3 0 009.5 1.5H3.3A1.3 1.3 0 002 2.8v6.2a1.3 1.3 0 001.3 1.3h.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>复制译文</span>
      </button>
      <button class="act" id="shotBtn" title="截图保存">
        <svg viewBox="0 0 16 16"><path d="M2 5.2h1.7l1-1.6h6.6l1 1.6H14v7.1H2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8.6" r="2.1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>截图</span>
      </button>
      <button class="act toggle" id="compareBtn" title="原文/译文对照">
        <svg viewBox="0 0 16 16"><path d="M2 3.4h5v9.2H2zM9 3.4h5v9.2H9z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.6 6.2h1.9M3.6 8.4h1.9M3.6 10.6h1.9M10.6 6.2h1.9M10.6 8.4h1.9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        <span>对照</span>
      </button>
      <button class="act toggle" id="origBtn" title="切换原图 / 译文">
        <svg viewBox="0 0 16 16"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.8 10.4l3.3-3 2.7 2.4 2.1-1.9 3.9 3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="10.9" cy="5.9" r="1" fill="currentColor"/></svg>
        <span id="origLabel">原图</span>
      </button>
    </div>

    <div class="group tail">
      <button class="act err" id="retryBtn" style="display:none">
        <span>重试</span>
      </button>
      <button class="icon" id="closeBtn" title="关闭 (Esc)">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="menu" id="srcMenu"></div>
  <div class="menu" id="tgtMenu"></div>
  <div class="tip" id="tip"></div>

  <script src="toolbar.js"></script>
</body>
</html>
