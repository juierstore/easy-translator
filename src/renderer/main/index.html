<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: etimg:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>EasyTranslator</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body data-page="history">
  <header class="titlebar">
    <div class="brand">
      <div class="logo">译</div>
      <span class="brand-name">EasyTranslator</span>
      <span class="brand-sub">截图取词翻译</span>
    </div>
    <div class="win-actions">
      <button class="wbtn" id="btnMin" title="最小化"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="wbtn" id="btnMax" title="最大化"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="wbtn close" id="btnClose" title="关闭"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <nav class="nav">
        <button class="nav-item active" data-nav="history">
          <svg viewBox="0 0 16 16"><rect x="2" y="2.6" width="12" height="10.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.3"/><circle cx="5" cy="4.3" r=".8" fill="currentColor"/></svg>
          <span>历史记录</span>
        </button>
        <button class="nav-item" data-nav="text">
          <svg viewBox="0 0 16 16"><path d="M2.4 3.6h6.2M5.5 3.6v9.2M2.4 12.8h6.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9.6 7.2h4.2M11.7 7.2v5.6M9.8 12.8h3.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>文字翻译</span>
        </button>
        <button class="nav-item" data-nav="settings">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>设置</span>
        </button>
      </nav>

      <div class="side-foot">
        <button class="capture-btn" id="btnCapture">
          <svg viewBox="0 0 16 16"><path d="M2 5.4h1.8l1-1.7h6.4l1 1.7H14v7H2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8.7" r="2.1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>截图取词</span>
          <kbd id="hkHint">Alt+Shift+S</kbd>
        </button>
        <div class="ver" id="ver">v1.0.0</div>
      </div>
    </aside>

    <main class="content">
      <!-- ============ 历史记录 ============ -->
      <section class="page" id="page-history">
        <div class="page-head">
          <h1>历史记录</h1>
          <div class="head-tools">
            <div class="search">
              <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              <input id="histSearch" type="text" placeholder="搜索译文或原文…" />
            </div>
            <button class="ghost" id="btnClearHist">清空</button>
          </div>
        </div>
        <div class="hist-wrap">
          <div class="hist-list" id="histList"></div>
          <div class="hist-detail" id="histDetail">
            <div class="empty" id="histEmpty">
              <svg class="empty-svg" viewBox="0 0 48 48" fill="none">
                <rect x="6" y="9" width="36" height="30" rx="5" stroke="currentColor" stroke-width="1.6" opacity=".5"/>
                <path d="M7 15h34" stroke="currentColor" stroke-width="1.6" opacity=".35"/>
                <circle cx="11.5" cy="12" r="1.3" fill="currentColor" opacity=".5"/>
                <circle cx="15.5" cy="12" r="1.3" fill="currentColor" opacity=".35"/>
                <path d="M15 25h12M15 30h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".4"/>
                <path d="M30 21l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
              </svg>
              <p>还没有记录</p>
              <span>按 <kbd>Alt+Shift+S</kbd> 框选屏幕上的文字试试</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ 文字翻译 ============ -->
      <section class="page" id="page-text" hidden>
        <div class="page-head">
          <h1>文字翻译</h1>
          <div class="head-tools">
            <span class="model-tag" id="modelTag">deepseek-chat</span>
          </div>
        </div>
        <div class="tr-bar">
          <select id="trSrc" class="sel"></select>
          <button class="swap" id="btnSwap" title="对调语言">⇄</button>
          <select id="trTgt" class="sel"></select>
          <div class="spacer"></div>
          <span class="hint-mini">Ctrl + Enter 翻译</span>
        </div>
        <div class="tr-panes">
          <div class="pane">
            <div class="pane-head"><span>原文</span><span class="count" id="srcCount">0 字</span></div>
            <textarea id="trInput" placeholder="粘贴或输入要翻译的文字…" spellcheck="false"></textarea>
            <div class="pane-foot">
              <button class="ghost sm" id="btnPaste">粘贴</button>
              <button class="ghost sm" id="btnClearText">清空</button>
            </div>
          </div>
          <div class="pane out">
            <div class="pane-head">
              <span>译文</span>
              <span class="count" id="trMeta"></span>
            </div>
            <div class="out-box" id="trOutput"><span class="ph">译文会显示在这里</span></div>
            <div class="pane-foot">
              <button class="primary sm" id="btnTranslate">翻译</button>
              <button class="ghost sm" id="btnCopyOut">复制译文</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ 设置 ============ -->
      <section class="page" id="page-settings" hidden>
        <div class="page-head"><h1>设置</h1></div>
        <div class="settings">
          <div class="card">
            <div class="card-title">翻译引擎</div>
            <div class="row">
              <label>翻译通道</label>
              <div class="seg" id="segProvider">
                <button data-v="deepseek" class="on">DeepSeek API</button>
                <button data-v="free">免密通道</button>
              </div>
            </div>
            <div class="row">
              <label>API Key</label>
              <div class="kv">
                <input id="apiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" />
                <button class="ghost sm" id="btnSaveKey">保存</button>
                <button class="ghost sm" id="btnTestKey">测试</button>
              </div>
            </div>
            <div class="row">
              <label></label>
              <div class="kstatus" id="keyStatus">未配置 Key 时无法使用 DeepSeek 翻译</div>
            </div>
            <div class="row">
              <label>Base URL</label>
              <input id="baseUrl" type="text" spellcheck="false" />
            </div>
            <div class="row">
              <label>模型</label>
              <input id="model" type="text" spellcheck="false" placeholder="deepseek-chat" />
            </div>
          </div>

          <div class="card">
            <div class="card-title">截图取词</div>
            <div class="row">
              <label>全局快捷键</label>
              <div class="kv">
                <input id="hotkey" type="text" readonly placeholder="点击后按下组合键" />
                <button class="ghost sm" id="btnHotkey">重新录制</button>
              </div>
            </div>
            <div class="row">
              <label>默认目标语言</label>
              <select id="targetLang" class="sel wide"></select>
            </div>
            <div class="row">
              <label>识别语言</label>
              <select id="ocrLang" class="sel wide">
                <option value="auto">自动（中英混合）</option>
                <option value="zh-Hans-CN">简体中文</option>
                <option value="en-US">英语</option>
              </select>
            </div>
            <div class="row">
              <label>识别放大倍数</label>
              <select id="ocrUpscale" class="sel wide">
                <option value="1">1×（最快）</option>
                <option value="2">2×（推荐）</option>
                <option value="3">3×（小字体更准，稍慢）</option>
              </select>
            </div>
            <div class="row">
              <label>点击外部关闭结果</label>
              <label class="switch"><input type="checkbox" id="closeOnBlur" /><i></i></label>
            </div>
          </div>

          <div class="card">
            <div class="card-title">数据</div>
            <div class="row">
              <label>保留历史记录</label>
              <label class="switch"><input type="checkbox" id="keepHistory" /><i></i></label>
            </div>
            <div class="row">
              <label>最多保留条数</label>
              <select id="historyLimit" class="sel wide">
                <option value="100">100 条</option>
                <option value="300">300 条</option>
                <option value="1000">1000 条</option>
                <option value="3000">3000 条</option>
              </select>
            </div>
            <div class="row">
              <label></label>
              <div class="kv">
                <button class="ghost sm" id="btnOpenData">打开数据目录</button>
                <button class="ghost sm danger" id="btnClearAll">清空所有历史</button>
              </div>
            </div>
          </div>

          <div class="card about">
            <div class="card-title">关于</div>
            <div class="about-line"><span>OCR</span><b>Windows 原生识别引擎（系统自带，零安装）</b></div>
            <div class="about-line"><span>识别语言</span><b id="ocrInfo">—</b></div>
            <div class="about-line"><span>版本</span><b id="aboutVer">—</b></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <script src="main.js"></script>
</body>
</html>
